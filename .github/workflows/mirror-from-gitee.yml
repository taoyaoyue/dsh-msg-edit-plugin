name: 从 Gitee 镜像同步

# 每天 UTC 00:00（北京时间 08:00）把 Gitee 上的仓库整份镜像到本仓库；
# 也可以在 Actions 页面点 "Run workflow" 立刻跑一次。
#
# 和旧版（chem_project）的区别：
#   1. 不需要任何 PAT —— 推到「本仓库」用 Actions 自动发的 GITHUB_TOKEN 就够
#      （旧版要手动配 secrets.GH_TOKEN，是因为它把 PAT 写死在 URL 里）
#   2. 仓库名只在 env 里写一处，换仓库只改 GITEE_REPO 一行
#   3. 克隆失败自动重试 3 次；推完校验两边 HEAD 是否一致，不一致就让 job 变红
#   4. --prune：Gitee 上删掉的分支/标签，GitHub 这边也会跟着删
#   5. 只同步 refs/heads/* 和 refs/tags/*，不碰别的 ref

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-from-gitee
  cancel-in-progress: false

env:
  GITEE_OWNER: peach_moon
  GITEE_REPO: dsh-msg-edit-plugin

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 从 Gitee 裸克隆（失败重试 3 次）
        env:
          # Gitee 仓库是公开的就不用配这两个；将来转私有再加 GITEE_USER / GITEE_TOKEN
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          url="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          if [ -n "${GITEE_TOKEN:-}" ]; then
            url="https://${GITEE_USER:-$GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          fi
          for attempt in 1 2 3; do
            rm -rf repo.git
            if git clone --mirror "$url" repo.git; then
              break
            fi
            echo "第 ${attempt} 次克隆失败，10 秒后重试"
            sleep 10
            if [ "$attempt" = "3" ]; then
              echo "::error::从 Gitee 克隆连续失败，检查网络或仓库地址"
              exit 1
            fi
          done
          echo "Gitee HEAD : $(git -C repo.git rev-parse HEAD)"
          git -C repo.git log -1 --format='最新提交   : %h %s（%an, %ad）'
          echo "分支        :"
          git -C repo.git for-each-ref --format='  %(refname:short)' refs/heads

      - name: 强推到本仓库
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C repo.git push --force --prune "$remote" \
            "refs/heads/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"

      - name: 校验两边 HEAD 一致
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          gitee_head="$(git -C repo.git rev-parse HEAD)"
          github_head="$(git ls-remote "$remote" HEAD | cut -f1)"
          echo "Gitee  : $gitee_head"
          echo "GitHub : $github_head"
          if [ "$gitee_head" != "$github_head" ]; then
            echo "::error::两边 HEAD 不一致，同步没生效"
            exit 1
          fi
          echo "✅ 同步完成"
